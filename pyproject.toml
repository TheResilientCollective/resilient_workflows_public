[project]
name = "resilient-workflows-public"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"

# Core Dagster server and daemon dependencies
dependencies = [
    "dagster>=1.12.2",
    "dagit>=1.12.2",
    "dagster-webserver>=1.12.2",
    "dagster-postgres>=0.28.2",
    "dagster-docker>=0.28.2",
    "dagster-aws>=0.28.2",
    "dagster-dg-cli>=1.12.2",
]

[project.optional-dependencies]
# Workflow dependencies shared across code locations
workflows = [
    "dagstermill>=0.28.2",
    "dagster-slack>=0.28.2",
    "dagster-openai==0.28.2",
    "dagster-embedded-elt",
    "dagster-duckdb>=0.28.2",
    "dagster-duckdb-pandas>=0.28.2",

    "duckdb",

    # Data processing
    "pandas>=2.2.0",
    "pandas-stubs~=2.3.3",
    "geopandas",
    "pandera[pandas]",
    "pandera[geopandas]",
    "pyarrow>=20",
    "dask>=2025.11.0",
    "pydantic<3.0.0,>=2",
    "pydantic_schemaorg @ git+https://github.com/TheResilientCollective/pydantic_schemaorg.git@pydantic_v2",

    # Storage and cloud
    "minio==7.1.13",
    "docker>=6.1.0",
    "awswrangler",
    "boto3-stubs~=1.41.1",
    "pyairtable>3",

    # Tableau / Power BI
    "tableauhyperapi==0.0.22502", # x86_64 linux only — github action is amd64
    "tableaudocumentapi",
    "tableau_parser",
    "simplepbi>=1.00",

    # Geospatial
    "kml2geojson",
    "geopy",
    "matplotlib",

    # Web scraping and requests
    "beautifulsoup4",
    "lxml",
    "requests-cache",
    "retry-requests",
    "openmeteo-requests",
    "openmeteo_requests",
    "requests_cache",
    "retry_requests",
    "foursquare-data-sdk",
    "playwright>=1.35.0",
    "zeep>=4.3.1",
    "suds>=1.2.0",

    # Domain-specific
    "aqicalc",
    "noaa-coops>=0.4.0",
    "epiweeks",
    "astral==3.2",
    "scikit-learn",

    # Office and collaboration
    "office365-rest-python-client>=2.6.2",
    "sharepoint>=0.4.2",
    "openpyxl>=3.1.0",

    # Utilities
    "icecream>=2.1.4",
    "pydash",
    "pyyaml",
    "jinja2>=3.1.6",
    "tenacity==9.1.4",
    "pygithub>=2.8.1",
    "ipython-genutils==0.2.0",
    "notebook",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "dagster-dg-cli>=1.11.10"
]


[tool.dg]
directory_type = "project"

[tool.uv.workspace]
members = [
    "workflows/resilient_core",
    "workflows/tijuana",
    "workflows/pathogens",
    "workflows/epidemiology",
    "workflows/sim",
]

[tool.uv.sources]
resilient_core = { workspace = true }
tijuana = { workspace = true }
pathogens = { workspace = true }
epidemiology = { workspace = true }
sim = { workspace = true }
