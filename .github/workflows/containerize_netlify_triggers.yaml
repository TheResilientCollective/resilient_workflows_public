name: Dockerize Netlify Triggers
# Build and push Docker image for the Netlify approval workflow Slack bot

on:
  push:
    branches:
      - master
      - dev
      - feature/*
      - data/*
      - fix/*
    paths:
      - 'netlify_triggers/**'
      - '.github/workflows/containerize_netlify_triggers.yaml'
    tags:
      - "netlify-v*.*.*"
  workflow_dispatch:  # Allow manual trigger

defaults:
  run:
    working-directory: .

jobs:
  build_netlify_triggers:
    name: Dockerize Netlify Triggers Slack Bot
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          REGISTRY_IMAGE=resilientucsd/netlify-triggers
          echo "REGISTRY_IMAGE=$REGISTRY_IMAGE" >> $GITHUB_ENV
        working-directory: /

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=true
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          file: ./netlify_triggers/Dockerfile
          context: ./netlify_triggers
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

      - name: Generate deployment summary
        run: |
          echo "### Netlify Triggers Docker Build Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** " >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Pull Command:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY_IMAGE }}:$(echo $GITHUB_REF | sed 's/refs\/heads\///')" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY