version: "3.9"
networks:
  dagster_host:
    external: true
    name: ${RESILIENT_DAGSTER_NETWORK:-dagster_host}
  traefik_proxy:
     external: true
volumes:

  dagster-storage:
    driver: local
    name: ${RESILIENT_DAGSTER_STORAGE:-dagster_storage}

# DO NOT START IN PYCHARM (unless you set the env variables in your runconfig
# USE:
# ./docker_RESILIENT_prod_start.h
services:
## GRPC servers are not just serving the code
# they need to compile it, so same image for all dagster-*
# for this a PROJECT IS REQUIRED to allow for multiple communities
    dagster-code-tijuana:
        hostname: dagster-code-${PROJECT}-tijuana
        image: docker.io/resilientucsd/dagster-resilient-workflows:${CONTAINER_CODE_TAG:-latest}
        platform: linux/amd64
        environment: &env
            - DEBUG_CONTAINER=${DEBUG_CONTAINER:-false}
            - PROJECT=${PROJECT}
            - RESILIENT_DOCKER_WORKSPACE_CONFIG=${RESILIENT_DOCKER_WORKSPACE_CONFIG}
            - S3_SECRET_KEY=${S3_SECRET_KEY}
            - S3_ACCESS_KEY=${S3_ACCESS_KEY}
            - S3_ADDRESS=${S3_ADDRESS}
            - S3_BUCKET=${S3_BUCKET}
            - S3_PORT=${S3_PORT}
            - S3_USE_SSL=${S3_USE_SSL}
            - AIRTABLE_API_KEY=${AIRTABLE_API_KEY}
            - AIRTABLE_BASE=${AIRTABLE_BASE}
            - AIRTABLE_ACCESS_TOKEN=${AIRTABLE_ACCESS_TOKEN}
            - AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID}
            - AIRTABLE_MPOX_TABLE_ID=${AIRTABLE_MPOX_TABLE_ID}
            - AIRTABLE_EPI_DISEASE_TABLE_ID=${AIRTABLE_EPI_DISEASE_TABLE_ID}
            - AIRTABLE_EPI_NEW_CASES_TABLE_ID=${AIRTABLE_EPI_NEW_CASES_TABLE_ID}
            - AIRTABLE_EPI_RT_ESTIMATES_TABLE_ID=${AIRTABLE_EPI_RT_ESTIMATES_TABLE_ID}
            - AIRTABLE_EPI_HOSPITAL_ADMISSIONS_TABLE_ID=${AIRTABLE_EPI_HOSPITAL_ADMISSIONS_TABLE_ID}
            - RESILIENT_DEFAULT_SCHEDULE=${RESILIENT_DEFAULT_SCHEDULE:-@weekly}
            - RESILIENT_DEFAULT_SCHEDULE_TIMEZONE=${RESILIENT_DEFAULT_SCHEDULE_TIMEZONE:-America/Los_Angeles}
            - RESILIENT_WORKSPACE_CONFIG_PATH=${RESILIENT_WORKSPACE_CONFIG_PATH}
            - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
            # these SLACK_ are env variables used by the Dagster slack library
            - SLACK_CHANNEL=${SLACK_CHANNEL:-"#test"}
            - SLACK_TOKEN=${SLACK_TOKEN}
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - OPENAI_BASE_URL=${OPENAI_BASE_URL}
            - OPENAI_BASE_MODEL=${OPENAI_BASE_MODEL}
            - PURPLE_AIR_API_KEY_READ=${PURPLE_AIR_API_KEY_READ}
            - PURPLE_AIR_API_KEY_WRITE=${PURPLE_AIR_API_KEY_WRITE}
            - AIRNOW_API_KEY=${AIRNOW_API_KEY}
            - HOST=${HOST}
            - PUBLIC_BUCKET=${PUBLIC_BUCKET}
            - LATEST_BASEPATH=${LATEST_BASEPATH:-latest/epi/}
            - RESILIENTSIMS_SERVER_URL=${RESILIENTSIMS_SERVER_URL:-https://sims.resilientservice.mooo.com}
            - RESILIENTSIMS_API_PATH=${RESILIENTSIMS_API_PATH:-/api/v1}
            - RESILIENTSIMS_USERNAME=${RESILIENTSIMS_USERNAME}
            - RESILIENTSIMS_PASSWORD=${RESILIENTSIMS_PASSWORD}
            - RESILIENTSIMS_BUCKET=${RESILIENTSIMS_BUCKET:-resilientseasonal}
            - RESILIENTSIMS_SIMULATOR_ID=${RESILIENTSIMS_SIMULATOR_ID}
            - RESILIENTLLM_API_TOKEN=${RESILIENTLLM_API_TOKEN}
            - SLACK_SIMS_CHANNEL=${SLACK_SIMS_CHANNEL}
            - FORECAST_NETLIFY_PREVIEW_HOOK=${FORECAST_NETLIFY_PREVIEW_HOOK}
            - FORECAST_NETLIFY_PRODUCTION_HOOK=${FORECAST_NETLIFY_PRODUCTION_HOOK}
            - FORECAST_NETLIFY_PREVIEW_URL=${FORECAST_NETLIFY_PREVIEW_URL}
            - FORECAST_NETLIFY_PRODUCTION_URL=${FORECAST_NETLIFY_PRODUCTION_URL}
            - TRIGGER_PREVIEW_HOOK=${TRIGGER_PREVIEW_HOOK}
            - FORECAST_AIRTABLE_RSV_PORTAL_RECORDID=${FORECAST_AIRTABLE_RSV_PORTAL_RECORDID}
            - FORECAST_AIRTABLE_RSV_PORTAL_RECORDNAME=${FORECAST_AIRTABLE_RSV_PORTAL_RECORDNAME}
            - FORECAST_AIRTABLE_UPDATES_TABLE_ID=${FORECAST_AIRTABLE_UPDATES_TABLE_ID}
            - FORECAST_AIRTABLE_WIDGETS_TABLE_ID=${FORECAST_AIRTABLE_WIDGETS_TABLE_ID}
            - FORECAST_NETLIFY_PREVIEW_HOOK=${FORECAST_NETLIFY_PREVIEW_HOOK}
        command:
            - "dagster"
            - "api"
            - "grpc"
            - "-h"
            - "0.0.0.0"
            - "-p"
            - "4000"
            - "-m"
            - "workflows.tijuana.src.tijuana"
            - "-d"
            - "/usr/src/app/"
        volumes: &codevol
            - dagster-storage:/usr/src/app/storage
        depends_on:
            - dagster-postgres
        networks:
            - dagster_host
            - traefik_proxy

    dagster-code-pathogens:
        hostname: dagster-code-${PROJECT}-pathogens
        image: docker.io/resilientucsd/dagster-resilient-workflows:${CONTAINER_CODE_TAG:-latest}
        platform: linux/amd64
        environment: *env
        command:
            - "dagster"
            - "api"
            - "grpc"
            - "-h"
            - "0.0.0.0"
            - "-p"
            - "4000"
            - "-m"
            - "workflows.pathogens.src.pathogens"
            - "-d"
            - "/usr/src/app/"
        volumes: *codevol
        depends_on:
            - dagster-postgres
        networks:
            - dagster_host
            - traefik_proxy

    dagster-code-epidemiology:
        hostname: dagster-code-${PROJECT}-epidemiology
        image: docker.io/resilientucsd/dagster-resilient-workflows:${CONTAINER_CODE_TAG:-latest}
        platform: linux/amd64
        environment: *env
        command:
            - "dagster"
            - "api"
            - "grpc"
            - "-h"
            - "0.0.0.0"
            - "-p"
            - "4000"
            - "-m"
            - "workflows.epidemiology.src.epidemiology"
            - "-d"
            - "/usr/src/app/"
        volumes: *codevol
        depends_on:
            - dagster-postgres
        networks:
            - dagster_host
            - traefik_proxy

    dagster-code-sim:
        hostname: dagster-code-${PROJECT}-sim
        image: docker.io/resilientucsd/dagster-resilient-workflows:${CONTAINER_CODE_TAG:-latest}
        platform: linux/amd64
        environment: *env
        command:
            - "dagster"
            - "api"
            - "grpc"
            - "-h"
            - "0.0.0.0"
            - "-p"
            - "4000"
            - "-m"
            - "workflows.sim.src.sim"
            - "-d"
            - "/usr/src/app/"
        volumes: *codevol
        depends_on:
            - dagster-postgres
        networks:
            - dagster_host
            - traefik_proxy

