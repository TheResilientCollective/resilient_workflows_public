[project]
name = "tijuana"
version = "0.1.0"
description = "Tijuana / San Diego regional environmental monitoring Dagster assets"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.12.2",
    "dagster-aws>=0.28.2",
    "dagster-slack>=0.28.2",
    "resilient_core",
    "pandas>=2.2.0",
    "geopandas",
    "pandera[pandas]",
    "pandera[geopandas]",
    "kml2geojson",
    "aqicalc",
    "lxml",
    "beautifulsoup4",
    "openmeteo-requests",
    "openmeteo_requests",
    "requests-cache",
    "retry-requests",
    "retry_requests",
    "requests_cache",
    "foursquare-data-sdk",
    "noaa-coops>=0.4.0",
    "astral==3.2",
    "tenacity==9.1.4",
    "geopy",
    "playwright>=1.35.0",
    "pyyaml",
    "matplotlib",
    "dagster-openai==0.28.2",
    "scikit-learn",
    "awswrangler",
    "dask>=2025.11.0",
    "jinja2>=3.1.6",
    "pydash",
    "pydantic<3.0.0,>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tijuana"]

[tool.uv.sources]
resilient_core = { workspace = true }
