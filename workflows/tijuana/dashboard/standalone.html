<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>

  --cds-font-weight-medium: 600;

    --color-border-line: #3a3833; --color-ok: #5cc28a; --color-warn: #e3b13c; --color-bad: #ef7b67;
    --cds-chart-grid: #34322d; --cds-chart-axis: #55524b; --cds-chart-reference: #8a857c; --cds-chart-muted: #6e6a62;
    --cds-chart-status-critical: #ef7b67; --cds-surface-popover: #2c2b27; --cds-border: #3a3833; --cds-text-secondary: #a39f97;

<script>
// A small stand-in for the Claude dashboard runtime: loads each dataset from data/<id>.json
// and gives the page the same dash.data / dash.calc / dash.onData calls it uses there.
window.dash = (() => {
  const DATASETS = __DATASETS__;
  const state = {}, calcs = {}, subs = [];
  const run = () => subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  const data = (id) => {
    const c = calcs[id];
    if (!c) return state[id] || { status: 'loading', data: [], meta: [] };
    const inputs = c.inputs.map(data);
    const bad = inputs.find((x) => x.status !== 'ok');
    if (bad) return { status: bad.status === 'error' ? 'error' : 'loading', data: [], meta: [] };
    try { return { status: 'ok', data: c.fn(...inputs.map((x) => x.data)), meta: [] }; }
    catch (e) { console.error(e); return { status: 'error', data: [], meta: [], message: String(e) }; }
  };
  DATASETS.forEach((id) => {
    state[id] = { status: 'loading', data: [], meta: [] };
    fetch(`data/${id}.json`, { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((rows) => { state[id] = { status: 'ok', data: rows, columns: rows[0] ? Object.keys(rows[0]) : [], meta: [] }; run(); })
      .catch((e) => { state[id] = { status: 'error', data: [], meta: [], message: String(e) }; run(); });
  });
  let pending = null;
  window.addEventListener('resize', () => { clearTimeout(pending); pending = setTimeout(run, 150); });
  return {
    data,
    onData(fn) { subs.push(fn); try { fn(); } catch (e) { console.error(e); } },
    calc(id, opts) { calcs[id] = opts; },
    loader() {},
    colors: [0, 1, 2, 3, 4, 5, 6, 7].map((i) => `var(--tj-s${i})`),
    params: () => ({}), setParams() {}, resetParams() {}, setLink() {}, refresh() {},
  };
})();
</script>
</head>
<body>
<div id="dash-root">
__PAGE__
<p class="tj-site-footer">Data from the Resilient Collective pipeline (San Diego APCD, IBWC, Open-Meteo and the H2S forecast), refreshed at 10:45 am and 7:45 pm Pacific. Part of the <a href="https://resilient.ucsd.edu/">Resilient Collective</a>.</p>
</div>
</body>
