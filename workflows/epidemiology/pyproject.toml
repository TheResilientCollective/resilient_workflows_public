[project]
name = "epidemiology"
version = "0.1.0"
description = "San Diego epidemiology surveillance Dagster assets"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.12.2",
    "dagster-aws>=0.28.2",
    "dagster-slack>=0.28.2",
    "dagster-openai==0.28.2",
    "resilient_core",
    "pandas>=2.2.0",
    "geopandas",
    "pandera[pandas]",
    "tableauhyperapi==0.0.22502",
    "tableaudocumentapi",
    "tableau_parser",
    "simplepbi>=1.00",
    "office365-rest-python-client>=2.6.2",
    "sharepoint>=0.4.2",
    "openpyxl>=3.1.0",
    "requests",
    "requests-cache",
    "epiweeks",
    "pydantic<3.0.0,>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epidemiology"]

[tool.uv.sources]
resilient_core = { workspace = true }
