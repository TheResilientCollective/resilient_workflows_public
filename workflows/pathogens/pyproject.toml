[project]
name = "pathogens"
version = "0.1.0"
description = "CDC NNDSS, mpox, wahis pathogen surveillance Dagster assets"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.12.2",
    "dagster-aws>=0.28.2",
    "dagster-slack>=0.28.2",
    "dagster-openai==0.28.2",
    "resilient_core",
    "pandas>=2.2.0",
    "geopandas",
    "pandera[pandas]",
    "pandera[geopandas]",
    "requests",
    "requests-cache",
    "beautifulsoup4",
    "lxml",
    "openpyxl>=3.1.0",
    "epiweeks",
    "duckdb",
    "simplepbi>=1.00",
    "pydantic<3.0.0,>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathogens"]

[tool.uv.sources]
resilient_core = { workspace = true }
