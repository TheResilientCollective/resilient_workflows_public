[project]
name = "resilient_core"
version = "0.1.0"
description = "Shared utilities and resources for Resilient Collective Dagster projects"
requires-python = ">=3.12"
# Base install: only what the epi schemas (resilient_core.utils.resilient_epi_schemas) and the
# forecasting metrics/backtest (resilient_core.forecasting) need.
# Dagster resources, S3 storage, geo, model libraries and other integrations live in extras below.
dependencies = [
    "numpy",
    "pandas>=2.2.0",
    "pandera[pandas]",
    "epiweeks",
    "requests",
    "pydantic<3.0.0,>=2",
]

[project.optional-dependencies]
dagster = [
    "dagster>=1.12.2",
    "dagster-aws>=0.28.2",
]
s3 = [
    "minio==7.1.13",
    "awswrangler",
    "pyarrow>=20",
    "pydantic_schemaorg @ git+https://github.com/TheResilientCollective/pydantic_schemaorg.git@pydantic_v2",
]
geo = [
    "geopandas",
    "pandera[geopandas]",
]
airtable = [
    "pyairtable>3",
]
sharepoint = [
    "office365-rest-python-client>=2.6.2",
    "sharepoint>=0.4.2",
]
foursquare = [
    "foursquare-data-sdk",
]
tableau = [
    "tableauhyperapi==0.0.22502",
]
# Renewal-equation Rt (resilient_core.forecasting.renewal).
renewal = [
    "scipy",
]
# Foundation-model predictors (resilient_core.forecasting.load_*) and TabPFN Bayesian
# optimisation for the renewal fit. Pulls in torch; not part of `all`.
tabular = [
    "resilient_core[renewal]",
    "pandas>=2.3,<2.4",
    "torch>=2.15.0",
    "timesfm[torch]>=3.0.2",
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
    "tabpfn-time-series>=1.4.0",
    "tabpfn-extensions[bayesian-optimization]>=0.6.3",
]
# Everything the Dagster code locations use. Excludes `tabular` (torch and model weights).
all = [
    "resilient_core[dagster,s3,geo,airtable,sharepoint,foursquare,tableau]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_core"]
