[project]
name = "sim"
version = "0.1.0"
description = "Resilient Sims epidemic forecasting Dagster assets"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.12.2",
    "dagster-aws>=0.28.2",
    "dagster-slack>=0.28.2",
    "dagster-openai==0.28.2",
    "resilient_core",
    "pandas>=2.2.0",
    "geopandas",
    "pandera[pandas]",
    "scikit-learn",
    "awswrangler",
    "pygithub>=2.8.1",
    "requests",
    "epiweeks",
    "pyairtable>3",
    "pyyaml",
    "jinja2>=3.1.6",
    "icecream>=2.1.4",
    "boto3-stubs~=1.41.1",
    "minio==7.1.13",
    "gitpython",
    "pydantic<3.0.0,>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim"]

[tool.uv.sources]
resilient_core = { workspace = true }
